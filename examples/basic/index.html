<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>cesium-geospatial · basic example</title>
    <!-- 空 favicon：避免浏览器自动请求 /favicon.ico 产生 404 -->
    <link rel="icon" href="data:," />
    <script>
      // 必须在任何 Cesium 模块执行前设置：Cesium 用它拼 Workers/Assets/ThirdParty 的 URL。
      // 对应 vite.config.ts 里把 node_modules/cesium/Build/Cesium/* 拷到 /cesium/。
      window.CESIUM_BASE_URL = '/cesium/'
    </script>
    <!-- Cesium widget 样式：缺它 Viewer 的 canvas/控件不会铺满容器 -->
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
    <style>
      html,
      body,
      #cesiumContainer {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
